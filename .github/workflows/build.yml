name: Uygulamayı derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 1) Test APK: install directly on the phone / tablet
      - name: Test APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: goz-klavyesi-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 2) Signed APK + AAB for Google Play (only when the signing secrets exist)
      - name: İmzalı sürüm (Play Store)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GK_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export GK_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: goz-klavyesi-play-store
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
