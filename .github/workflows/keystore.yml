name: İmza anahtarı oluştur (bir kez)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Anahtar şifresi (en az 8 karakter, bir yere not edin)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Anahtarı üret
        env:
          P: ${{ inputs.password }}
        run: |
          echo "::add-mask::$P"
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Goz Klavyesi"
          base64 -w0 upload.jks > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari-SAKLAYIN
          path: |
            upload.jks
            KEYSTORE_BASE64.txt
          retention-days: 1
